apiVersion: v1
kind: ConfigMap
metadata:
  name: medicare-portal-content
data:
  index.html: |
    <!doctype html>
    <html>
      <head><title>Medicare Portal Container Demo</title></head>
      <body style="font-family:Arial;margin:40px">
        <h1>Medicare Portal - Container Workload</h1>
        <p>This page is running on a regional Google Kubernetes Engine cluster.</p>
        <p>The Deployment uses three replicas, a PodDisruptionBudget, and zone topology spreading.</p>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medicare-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: medicare-portal
  template:
    metadata:
      labels:
        app: medicare-portal
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: medicare-portal
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
      volumes:
        - name: content
          configMap:
            name: medicare-portal-content
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: medicare-portal
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: medicare-portal
---
apiVersion: v1
kind: Service
metadata:
  name: medicare-portal
spec:
  type: LoadBalancer
  selector:
    app: medicare-portal
  ports:
    - name: http
      port: 80
      targetPort: 80
